<!-- Google Play feature graphic, 1024 x 500. Rendered by render.sh.

     Play crops this asset on some surfaces, so nothing that carries meaning
     goes in the outer 100 px: the mark starts at x=132 and the longest line
     ends before x=930. `render.sh` also emits a proof with those margins
     shaded — look at it, do not assume. -->
<style>
  @page { margin: 0 }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden }

  body {
    display: flex;
    align-items: center;
    gap: 56px;
    padding: 0 116px 0 116px;
    box-sizing: border-box;
    background: linear-gradient(160deg, #12211C 0%, #08120F 100%);
    font-family: "SF Pro Display", -apple-system, system-ui, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* A soft green lift behind the mark, so the plate is not a flat rectangle. */
  .glow {
    position: absolute;
    left: 60px; top: 50%;
    width: 520px; height: 520px;
    transform: translateY(-50%);
    background: radial-gradient(circle, rgba(31,169,122,.28) 0%, rgba(31,169,122,0) 68%);
    pointer-events: none;
  }

  .mark { width: 208px; height: 208px; flex: none; position: relative }
  .mark img { width: 100%; height: 100% }

  .copy { position: relative }

  h1 {
    margin: 0;
    font-size: 72px;
    line-height: 1.02;
    font-weight: 700;
    letter-spacing: -0.025em;
    color: #FFFFFF;
    white-space: nowrap;
  }

  p {
    margin: 18px 0 0;
    font-size: 34px;
    line-height: 1.25;
    font-weight: 500;
    letter-spacing: -0.005em;
    color: #45E0A6;
  }

  .sub {
    margin-top: 14px;
    font-size: 25px;
    font-weight: 400;
    letter-spacing: 0;
    color: #94A79E;
  }
</style>

<div class="glow"></div>
<div class="mark"><img src="../icon/icon_mark.png" alt=""></div>
<div class="copy">
  <h1>Honest Signal</h1>
  <p>Bars that don&rsquo;t lie.</p>
  <div class="sub">Measures the connection, not the radio.</div>
</div>
